    async function loadBackupStats() {
      try {
        const res = await fetch('/api/admin/backups/stats');
        const json = await res.json();
        if (!res.ok || !json.success) return;

        const overview = json.overview || {};
        const config = json.backupConfig || {};
        backupCachedConfig = config;

        // KPI 1: Last backup
        const timeEl = document.getElementById('backupStatLastTime');
        const detailEl = document.getElementById('backupStatLastDetail');
        if (overview.lastBackup) {
          if (timeEl) timeEl.textContent = formatDateTime(overview.lastBackup.createdAt);
          if (detailEl) detailEl.textContent = `Dung lượng: ${overview.lastBackup.fileSizeMB} MB (${(overview.lastBackup.totalDocuments || 0).toLocaleString('vi-VN')} bản ghi)`;
        } else {
          if (timeEl) timeEl.textContent = 'Chưa có bản lưu';
          if (detailEl) detailEl.textContent = 'Hãy tạo bản sao lưu đầu tiên';
        }

        // KPI 2: Total backups
        const totalEl = document.getElementById('backupStatTotal');
        const breakdownEl = document.getElementById('backupStatBreakdown');
        if (totalEl) totalEl.textContent = overview.totalBackups || 0;
        if (breakdownEl && overview.breakdown) {
          breakdownEl.textContent = `Thủ công: ${overview.breakdown.manual} | Tự động: ${overview.breakdown.scheduled} | Cứu hộ: ${overview.breakdown.snapshot}`;
        }

        // KPI 3: Total disk size
        const sizeEl = document.getElementById('backupStatTotalSize');
        if (sizeEl) sizeEl.textContent = `${overview.totalSizeMB || '0.00'} MB`;

        // KPI 4: Auto backup config status
        const autoStatusEl = document.getElementById('backupStatAutoStatus');
        const autoDetailEl = document.getElementById('backupStatAutoDetail');
        if (autoStatusEl) {
          if (config.autoBackup) {
            autoStatusEl.textContent = 'Đang BẬT';
            autoStatusEl.style.color = '#059669';
          } else {
            autoStatusEl.textContent = 'Đang TẮT';
            autoStatusEl.style.color = '#DC2626';
          }
        }
        if (autoDetailEl) {
          autoDetailEl.textContent = config.autoBackup 
            ? `Chạy lúc ${config.scheduleTime || '02:00'} (Lưu ${config.retentionDays || 30} ngày)`
            : 'Sao lưu tự động bị vô hiệu hóa';
        }
      } catch (err) {
        console.warn('Lỗi loadBackupStats:', err);
      }
    }

            dateRangeBadge = `<span style="font-size: 11px; color: #B45309; display: inline-flex; align-items: center; gap: 4px; background: #FEF3C7; padding: 2px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap;">
              <i class="far fa-calendar-alt"></i> ${sDate} → ${eDate}
            </span>`;
          }

          const sizeMB = (b.fileSize / 1024 / 1024).toFixed(2);
          const totalDocs = b.totalDocuments || 0;

          return `
            <tr style="border-bottom: 1px solid var(--line); font-size: 13px; transition: background 0.15s;" onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='transparent'">
              <td style="padding: 12px 16px; white-space: nowrap;">
                <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                  <span style="font-family: monospace; font-weight: 700; color: var(--navy-900); font-size: 13px;">${escapeHtml(b.backupCode)}</span>
                  ${b.restoredCount > 0 ? `<span class="badge" style="background:#ECFDF5; color:#059669; font-size: 11px; padding: 2px 6px; white-space: nowrap;"><i class="fas fa-check-circle"></i> Đã phục hồi (${b.restoredCount})</span>` : ''}
                </div>
              </td>
              <td style="padding: 12px 16px; white-space: nowrap;">
                <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                  <span style="font-weight: 600; color: #1E40AF; white-space: nowrap;" title="${escapeHtml(b.fileName)}">
                    <i class="far fa-file-archive" style="margin-right: 4px; color: #3B82F6;"></i>${escapeHtml(b.fileName)}
                  </span>
                  ${dateRangeBadge}
                  ${b.note ? `<span style="font-size: 12px; color: var(--muted); background: #F1F5F9; padding: 2px 8px; border-radius: 4px; font-style: italic; white-space: nowrap;" title="${escapeHtml(b.note)}"><i class="fas fa-info-circle" style="font-size: 11px; margin-right: 3px;"></i>${escapeHtml(b.note)}</span>` : ''}
                </div>
              </td>
              <td style="padding: 12px 16px; text-align: center; white-space: nowrap;">
                ${typeBadge}
              </td>
              <td style="padding: 12px 16px; text-align: center; white-space: nowrap;">
                ${scopeBadge}
              </td>
              <td style="padding: 12px 16px; white-space: nowrap;">
                <span style="font-weight: 600; color: var(--navy-900);">${formatDateTime(b.createdAt)}</span>
                <span style="font-size: 11px; color: var(--muted); margin-left: 6px; background: #F1F5F9; padding: 2px 6px; border-radius: 4px; white-space: nowrap;">Bởi: ${escapeHtml(b.creatorName || 'Hệ thống')}</span>
              </td>
              <td style="padding: 12px 16px; text-align: right; white-space: nowrap; font-family: monospace; font-weight: 600; color: var(--navy-900);">
                ${sizeMB} MB
              </td>
              <td style="padding: 12px 16px; text-align: right; white-space: nowrap; font-family: monospace; font-weight: 700; color: #059669;">
                ${totalDocs.toLocaleString('vi-VN')}
              </td>
              <td style="padding: 12px 16px; text-align: center; white-space: nowrap;">
                <div style="display: flex; gap: 6px; justify-content: center; white-space: nowrap;">
                  <button class="btn btn-secondary btn-sm" onclick="downloadBackup('${b._id}')" title="Tải tệp ZIP về máy tính" style="padding: 5px 9px;">
                    <i class="fas fa-download" style="color: #2563EB;"></i>
                  </button>
                  <button class="btn btn-secondary btn-sm" onclick="openRestoreBackupModal('${b._id}', '${escapeHtml(b.backupCode)}', '${escapeHtml(b.fileName)}', ${totalDocs})" title="Phục hồi cơ sở dữ liệu từ bản này" style="padding: 5px 9px; border-color: #F87171; color: #DC2626;">
                    <i class="fas fa-undo"></i> Phục hồi
                  </button>
                  <button class="btn btn-secondary btn-sm" onclick="confirmDeleteBackup('${b._id}', '${escapeHtml(b.backupCode)}')" title="Xóa bản sao lưu này" style="padding: 5px 8px; color: #64748B;">
                    <i class="fas fa-trash-alt"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        renderBackupPagination({
          total: json.total || 0,
          totalPages: json.totalPages || 1,
          currentPage: json.page || 1,
          limit: 10
        });
        markTabLoaded('backup-restore');
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; padding: 30px; color: #EF4444;">
              <i class="fas fa-exclamation-triangle" style="font-size: 24px; margin-bottom: 8px;"></i>
              <div>${escapeHtml(err.message || 'Lỗi khi tải danh sách sao lưu')}</div>
            </td>
          </tr>
        `;
      }
    }

    function renderBackupPagination(pagination) {
      const { total, totalPages, currentPage, limit } = pagination;
      const infoEl = document.getElementById('backupPaginationInfo');
      const btnsEl = document.getElementById('backupPaginationBtns');

      if (infoEl) {
        const from = Math.min((currentPage - 1) * limit + 1, total);
        const to = Math.min(currentPage * limit, total);
        infoEl.textContent = `Đang hiển thị ${total > 0 ? from : 0} - ${to} trong tổng số ${total.toLocaleString('vi-VN')} bản ghi`;
      }

      if (btnsEl) {
        let html = '';
        if (totalPages > 1) {
          html += `<button class="btn btn-secondary btn-sm" ${currentPage <= 1 ? 'disabled' : ''} onclick="loadBackupList(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
          let startPage = Math.max(1, currentPage - 2);
          let endPage = Math.min(totalPages, currentPage + 2);
          for (let p = startPage; p <= endPage; p++) {
            html += `<button class="btn btn-sm ${p === currentPage ? 'btn-primary' : 'btn-secondary'}" onclick="loadBackupList(${p})">${p}</button>`;
          }
          html += `<button class="btn btn-secondary btn-sm" ${currentPage >= totalPages ? 'disabled' : ''} onclick="loadBackupList(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
        }
        btnsEl.innerHTML = html;
      }
    }

    function resetBackupFilters() {
      const search = document.getElementById('backupSearchInput');
      if (search) search.value = '';
      const type = document.getElementById('backupTypeFilter');
      if (type) {
        type.value = 'ALL';
        if (window.UniversalDropdown) UniversalDropdown.sync(type);
      }
      const startDateInput = document.getElementById('backupFilterStartDate');
      if (startDateInput) startDateInput.value = '';
      const endDateInput = document.getElementById('backupFilterEndDate');
      if (endDateInput) endDateInput.value = '';
      loadBackupList(1);
      loadBackupStats();
    }

    function quickFilterBackupType(type) {
      const typeSelect = document.getElementById('backupTypeFilter');
      if (typeSelect) {
        typeSelect.value = type;
        if (window.UniversalDropdown) UniversalDropdown.sync(typeSelect);
      }
      loadBackupList(1);
    }

    function openCreateBackupModal() {
      const noteInput = document.getElementById('createBackupNote');
      if (noteInput) noteInput.value = '';
      const fullRadio = document.querySelector('input[name="backupScopeOption"][value="FULL"]');
      if (fullRadio) fullRadio.checked = true;
      const typeSelect = document.getElementById('createBackupType');
      if (typeSelect) {
        typeSelect.value = 'MANUAL';
        if (window.UniversalDropdown) UniversalDropdown.sync(typeSelect);
      }
      const allDateRadio = document.querySelector('input[name="backupDateMode"][value="ALL"]');
      if (allDateRadio) allDateRadio.checked = true;
      const startDateInput = document.getElementById('createBackupStartDate');
      if (startDateInput) startDateInput.value = '';
      const endDateInput = document.getElementById('createBackupEndDate');
      if (endDateInput) endDateInput.value = '';
      const includeMasterCheck = document.getElementById('createBackupIncludeMaster');
      if (includeMasterCheck) includeMasterCheck.checked = true;

      updateBackupScopeStyle();
      toggleBackupDateRangeMode();
      openModal('modalCreateBackup');
    }

    async function submitCreateBackup() {
      const btn = document.getElementById('btnSubmitCreateBackup');
      const noteInput = document.getElementById('createBackupNote');
      const note = noteInput ? noteInput.value.trim() : '';
      const selectedScope = document.querySelector('input[name="backupScopeOption"]:checked')?.value || 'FULL';
      const selectedType = document.getElementById('createBackupType')?.value || 'MANUAL';

      const isCustomDate = document.querySelector('input[name="backupDateMode"]:checked')?.value === 'CUSTOM';
      let startDate = null;
      let endDate = null;
      let includeMasterData = true;

      if (isCustomDate) {
        startDate = document.getElementById('createBackupStartDate')?.value || null;
        endDate = document.getElementById('createBackupEndDate')?.value || null;
        includeMasterData = document.getElementById('createBackupIncludeMaster')?.checked !== false;

        if (!startDate && !endDate) {
          showCustomToast('Vui lòng chọn ngày bắt đầu hoặc ngày kết thúc khi sao lưu theo khoảng ngày!', 'warning');
          return;
        }
        if (startDate && endDate && new Date(startDate) > new Date(endDate)) {
          showCustomToast('Ngày bắt đầu không được lớn hơn ngày kết thúc!', 'warning');
          return;
        }
      }

      const originalHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang xuất dữ liệu & nén ZIP...`;
      }

      try {
        const res = await fetch('/api/admin/backups', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            scope: selectedScope,
            backupType: selectedType,
            startDate,
            endDate,
            includeMasterData,
            note
          })
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Không thể tạo bản sao lưu');

        showCustomToast(`Tạo bản sao lưu [${json.data.backupCode}] thành công!`, 'success');
        closeModal('modalCreateBackup');
        loadBackupList(1);
        loadBackupStats();
      } catch (err) {
        showCustomToast(err.message || 'Lỗi khi tạo bản sao lưu', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }
    }

    function openRestoreBackupModal(id, backupCode, fileName, totalDocs) {
      document.getElementById('restoreTargetBackupId').value = id;
      document.getElementById('restoreTargetCode').textContent = backupCode;
      document.getElementById('restoreTargetFile').textContent = fileName;
      document.getElementById('restoreTargetDocs').textContent = `${Number(totalDocs).toLocaleString('vi-VN')} bản ghi`;
      document.getElementById('restoreAdminPassword').value = '';
      document.getElementById('restoreAutoSnapshotCheck').checked = true;
      openModal('modalRestoreBackup');
    }

    async function submitRestoreBackup() {
      const id = document.getElementById('restoreTargetBackupId').value;
      const adminPassword = document.getElementById('restoreAdminPassword').value;
      const autoSnapshot = document.getElementById('restoreAutoSnapshotCheck').checked;

      if (!adminPassword) {
        showCustomToast('Vui lòng nhập mật khẩu Admin để xác nhận ủy quyền!', 'warning');
        return;
      }

      const btn = document.getElementById('btnSubmitRestoreBackup');
      const originalHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang nạp lại dữ liệu CSDL...`;
      }

      try {
        const res = await fetch(`/api/admin/backups/${id}/restore`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminPassword, autoSnapshot })
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Lỗi trong quá trình phục hồi dữ liệu');

        showCustomToast(`Phục hồi CSDL thành công! Đã nạp lại ${json.data.totalRestoredRecords.toLocaleString('vi-VN')} bản ghi.`, 'success');
        closeModal('modalRestoreBackup');
        loadBackupList(backupCurrentPage || 1);
        loadBackupStats();
      } catch (err) {
        showCustomToast(err.message || 'Không thể phục hồi cơ sở dữ liệu', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }
    }

    function openUploadRestoreModal() {
      const fileInput = document.getElementById('uploadRestoreFileInput');
      if (fileInput) fileInput.value = '';
      const pwdInput = document.getElementById('uploadRestoreAdminPassword');
      if (pwdInput) pwdInput.value = '';
      const snapCheck = document.getElementById('uploadRestoreAutoSnapshotCheck');
      if (snapCheck) snapCheck.checked = true;
      openModal('modalUploadRestore');
    }

    async function submitUploadRestore() {
      const fileInput = document.getElementById('uploadRestoreFileInput');
      const pwdInput = document.getElementById('uploadRestoreAdminPassword');
      const autoSnapshot = document.getElementById('uploadRestoreAutoSnapshotCheck')?.checked;

      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        showCustomToast('Vui lòng chọn tệp .zip để tải lên!', 'warning');
        return;
      }

      const adminPassword = pwdInput ? pwdInput.value : '';
      if (!adminPassword) {
        showCustomToast('Vui lòng nhập mật khẩu Admin để xác thực!', 'warning');
        return;
      }

      const btn = document.getElementById('btnSubmitUploadRestore');
      const originalHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang tải lên và phục hồi...`;
      }

      try {
        const formData = new FormData();
        formData.append('backupFile', fileInput.files[0]);
        formData.append('adminPassword', adminPassword);
        formData.append('autoSnapshot', autoSnapshot ? 'true' : 'false');

        const res = await fetch('/api/admin/backups/upload-restore', {
          method: 'POST',
          body: formData
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Lỗi khi phục hồi từ file tải lên');

        showCustomToast(`Phục hồi thành công! Đã nạp lại ${json.data.totalRestoredRecords.toLocaleString('vi-VN')} bản ghi.`, 'success');
        closeModal('modalUploadRestore');
        loadBackupList(1);
        loadBackupStats();
      } catch (err) {
        showCustomToast(err.message || 'Lỗi khi phục hồi dữ liệu từ file', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }
    }

    function openBackupConfigModal() {
      if (backupCachedConfig) {
        const autoCheck = document.getElementById('configAutoBackupEnabled');
        if (autoCheck) autoCheck.checked = Boolean(backupCachedConfig.autoBackup);
        const timeInput = document.getElementById('configBackupScheduleTime');
        if (timeInput) timeInput.value = backupCachedConfig.scheduleTime || '02:00';
        const scopeSelect = document.getElementById('configBackupScope');
        if (scopeSelect) scopeSelect.value = backupCachedConfig.scope || 'FULL';
        const retSelect = document.getElementById('configBackupRetentionDays');
        if (retSelect) retSelect.value = String(backupCachedConfig.retentionDays || 30);
      }
      openModal('modalBackupConfig');
    }

    async function submitBackupConfig() {
      const autoBackup = document.getElementById('configAutoBackupEnabled')?.checked;
      const scheduleTime = document.getElementById('configBackupScheduleTime')?.value || '02:00';
      const scope = document.getElementById('configBackupScope')?.value || 'FULL';
      const retentionDays = parseInt(document.getElementById('configBackupRetentionDays')?.value) || 30;

      const btn = document.getElementById('btnSubmitBackupConfig');
      const originalHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang lưu...`;
      }

      try {
        const res = await fetch('/api/admin/backups/config', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ autoBackup, scheduleTime, scope, retentionDays })
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Không thể lưu cấu hình');

        showCustomToast('Cập nhật cấu hình tự động sao lưu thành công!', 'success');
        closeModal('modalBackupConfig');
        loadBackupStats();
      } catch (err) {
        showCustomToast(err.message || 'Lỗi khi lưu cấu hình', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      }
    }

    function downloadBackup(id) {
      showCustomToast('Bắt đầu tải về tệp sao lưu...', 'info');
      window.location.href = `/api/admin/backups/${id}/download`;
    }

    function confirmDeleteBackup(id, backupCode) {
      showConfirmModal(
        'Xóa bản sao lưu dữ liệu',
        `Bạn có chắc chắn muốn xóa vĩnh viễn bản sao lưu <strong>[${escapeHtml(backupCode)}]</strong>?<br><span style="color:#DC2626; font-size:12px;">Tệp vật lý trên máy chủ sẽ bị xóa hoàn toàn.</span>`,
        async () => {
          try {
            const res = await fetch(`/api/admin/backups/${id}`, { method: 'DELETE' });
            const json = await res.json();
            if (!res.ok || !json.success) throw new Error(json.message || 'Không thể xóa bản sao lưu');

            showCustomToast('Đã xóa bản sao lưu thành công!', 'success');
            loadBackupList(backupCurrentPage || 1);
            loadBackupStats();
          } catch (err) {
            showCustomToast(err.message || 'Lỗi khi xóa bản sao lưu', 'error');
          }
        }
      );
    }

    window.loadBackupStats = loadBackupStats;
    window.loadBackupList = loadBackupList;
    window.resetBackupFilters = resetBackupFilters;
    window.openCreateBackupModal = openCreateBackupModal;
    window.submitCreateBackup = submitCreateBackup;
    window.openRestoreBackupModal = openRestoreBackupModal;
    window.submitRestoreBackup = submitRestoreBackup;
    window.openUploadRestoreModal = openUploadRestoreModal;
    window.submitUploadRestore = submitUploadRestore;
    window.openBackupConfigModal = openBackupConfigModal;
    window.submitBackupConfig = submitBackupConfig;
    window.downloadBackup = downloadBackup;
    window.confirmDeleteBackup = confirmDeleteBackup;
    window.updateBackupScopeStyle = updateBackupScopeStyle;
    window.quickFilterBackupType = quickFilterBackupType;

    // --- SETUP GLOBAL LISTENERS ---
    document.addEventListener('DOMContentLoaded', () => {
      // Đảm bảo modal thẩm định kiểm kê luôn ẩn mặc định khi load trang
      closeAuditApprovalModal();
      loadAuditLogStats();

      // Setup navigation clicks
      document.querySelectorAll('#sideNav button[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          goToTab(btn.getAttribute('data-tab'));
        });
      });

      // Links with data-goto
      document.querySelectorAll('[data-goto]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          goToTab(el.getAttribute('data-goto'));
        });
      });

      // Logout button
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) logoutBtn.onclick = logout;

      // Khởi tạo Universal Custom Dropdown cho toàn bộ admin portal
      if (window.UniversalDropdown) {
        UniversalDropdown.attachAll();
      }

      // Check auth and boot
      checkAdminAuth();
    });
  </script>
</body>
</html>
