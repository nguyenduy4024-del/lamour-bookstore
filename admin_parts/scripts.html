    async function loadSupplierDetailBooks(supId) {
      const tbody = document.getElementById('supDetailBookTableBody');
      if (tbody) tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:18px;"><i class="fas fa-spinner fa-spin"></i> Đang tải danh mục sách...</td></tr>';

      try {
        const res = await fetch(`/api/inventory/suppliers/${supId}/books`, { headers: getAuthHeaders() });
        if (!res.ok) throw new Error('Không thể tải sách của NCC');
        const d = await res.json();
        const books = d.data || d || [];
        currentSupplierBooksCache = books;
        renderSupplierDetailBooks(books);
      } catch (err) {
        if (tbody) tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:18px; color:var(--danger);">${err.message}</td></tr>`;
      }
    }

    function renderSupplierDetailBooks(books) {
      const tbody = document.getElementById('supDetailBookTableBody');
      if (!tbody) return;

      if (!books || books.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:24px; color:var(--muted);"><i class="fas fa-book" style="font-size:20px; opacity:0.4; display:block; margin-bottom:6px;"></i>Chưa có cuốn sách nào liên kết với nhà cung cấp này</td></tr>';
        return;
      }

      tbody.innerHTML = books.map(b => `
        <tr>
          <td>
            <img src="${b.coverImage || b.imageUrl || '/images/covers/default-book.svg'}" onerror="handleImgError(this)" style="width:32px; height:44px; object-fit:cover; border-radius:3px; border:1px solid var(--line);" />
          </td>
          <td>
            <div style="font-weight:600; color:var(--navy-900);">${b.title}</div>
            <div style="font-size:11px; color:var(--muted);">ISBN: ${b.isbn || b.bookCode || '---'}</div>
          </td>
          <td><span class="badge b-user" style="font-size:11px;">${b.category || 'Văn học'}</span></td>
          <td style="text-align:right; font-weight:600;">${formatVND(b.price)}</td>
          <td style="text-align:right; color:var(--muted); font-size:11.5px;">${formatVND(b.costPrice || 0)}</td>
          <td style="text-align:center;">
            <span class="badge ${b.stock === 0 ? 'b-locked' : (b.stock <= 5 ? 'b-stock' : 'b-active')}">
              ${b.stock || 0}
            </span>
          </td>
          <td><span style="font-size:11.5px; color:var(--muted);"><i class="fas fa-map-marker-alt"></i> ${b.shelfLocation || 'Chưa xếp'}</span></td>
          <td style="text-align:center;">
            ${(b.isDeleted || b.status === 'hidden')
              ? '<span class="badge" style="background:#F1F5F9; color:#64748B; font-size:11px;">Đã ẩn</span>'
              : '<span class="badge" style="background:#DCFCE7; color:#15803D; font-size:11px;">Đang bán</span>'
            }
          </td>
        </tr>
      `).join('');
    }

    function filterSupplierDetailBooks() {
      const q = (document.getElementById('supBookFilterInput')?.value || '').trim().toLowerCase();
      let list = [...(currentSupplierBooksCache || [])];
      if (q) {
        list = list.filter(b => 
          (b.title && b.title.toLowerCase().includes(q)) ||
          (b.isbn && b.isbn.toLowerCase().includes(q)) ||
          (b.bookCode && b.bookCode.toLowerCase().includes(q)) ||
          (b.category && b.category.toLowerCase().includes(q))
        );
      }
      renderSupplierDetailBooks(list);
      const countEl = document.getElementById('supBookFilteredCount');
      if (countEl) countEl.textContent = `Hiển thị ${list.length} / ${currentSupplierBooksCache.length} đầu sách`;
    }

    async function loadSupplierDetailHistory(supId) {
      const tbody = document.getElementById('supDetailHistoryTableBody');
      if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:18px;"><i class="fas fa-spinner fa-spin"></i> Đang nạp lịch sử nhập hàng...</td></tr>';

      try {
        const res = await fetch(`/api/inventory/suppliers/${supId}/history`, { headers: getAuthHeaders() });
        if (!res.ok) throw new Error('Không thể tải lịch sử nhập hàng');
        const d = await res.json();
        const receipts = d.data || d || [];

        if (receipts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:24px; color:var(--muted);"><i class="fas fa-receipt" style="font-size:20px; opacity:0.4; display:block; margin-bottom:6px;"></i>Chưa có phiếu nhập hàng nào từ nhà cung cấp này</td></tr>';
          return;
        }

        tbody.innerHTML = receipts.map(r => {
          const qty = (typeof r.totalQuantity === 'number' && r.totalQuantity > 0)
            ? r.totalQuantity
            : (r.items ? r.items.reduce((s, it) => s + (Number(it.quantity) || 0), 0) : 0);
          const itemCount = (r.items && r.items.length) || r.itemCount || 0;
          const creator = r.creatorName || (r.createdUser && r.createdUser.name) || (r.createdBy && r.createdBy.name) || r.receiverStaff || 'Thủ kho';
          const importDate = r.importDate || r.receiptDate || r.createdAt;

          return `
          <tr>
            <td><strong style="font-family:monospace; color:var(--navy-900); cursor:pointer;" onclick="openReceiptApprovalModal('import', '${r._id}', true)" title="Nhấn để xem chi tiết phiếu nhập">${r.receiptCode || ('PN-' + r._id.slice(-6).toUpperCase())}</strong></td>
            <td>${formatDateTime(importDate)}</td>
            <td style="text-align:center;">
              <span class="badge b-staff" style="font-size:12px; font-weight:600; white-space:nowrap;">${qty.toLocaleString('vi-VN')} cuốn</span>
              <div style="font-size:11px; color:var(--muted); margin-top:2px;">(${itemCount} đầu sách)</div>
            </td>
            <td style="text-align:right; font-weight:700; color:#D97706;">${formatVND(r.totalAmount || 0)}</td>
            <td>${escapeHtml(creator)}</td>
            <td style="font-size:12px; color:var(--muted);">${escapeHtml(r.note || '---')}</td>
          </tr>
        `;
        }).join('');
      } catch (err) {
        if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:18px; color:var(--danger);">${err.message}</td></tr>`;
      }
    }

    function switchSupplierDetailTab(tab) {
      // Toggle button styles
      ['info', 'books', 'history'].forEach(t => {
        const btn = document.getElementById('btnTabSup' + t.charAt(0).toUpperCase() + t.slice(1));
        const content = document.getElementById('supTabContent' + t.charAt(0).toUpperCase() + t.slice(1));
        if (btn) {
          if (t === tab) {
            btn.classList.add('active');
            btn.style.color = 'var(--navy-900)';
            btn.style.fontWeight = '700';
            btn.style.borderBottom = '2px solid var(--gold-600)';
          } else {
            btn.classList.remove('active');
            btn.style.color = 'var(--muted)';
            btn.style.fontWeight = '500';
            btn.style.borderBottom = '2px solid transparent';
          }
        }
        if (content) {
          content.style.display = (t === tab) ? 'block' : 'none';
        }
      });
    }

    function editCurrentSupplierFromDetail() {
      if (!currentDetailSupplier) return;
      const supId = currentDetailSupplier._id;
      closeModal('supplierDetailModal');
      openSupplierModal(supId);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // --- MODULE: CASHBOOK ---
    let allCashbookEntries = [];

    function markCashbookAsRead() {
      const badge = document.getElementById('sidebarPendingCashbookBadge');
      if (badge) badge.style.display = 'none';
      const alertBox = document.getElementById('adminCashbookPendingAlert');
      if (alertBox) alertBox.style.display = 'none';
      localStorage.setItem('admin_cashbook_read_time', String(Date.now()));
    }
    window.markCashbookAsRead = markCashbookAsRead;

    async function checkPendingCashbookBadge(pendingCountParam) {
      const badge = document.getElementById('sidebarPendingCashbookBadge');
      const alertBox = document.getElementById('adminCashbookPendingAlert');
      const alertText = document.getElementById('adminCashbookPendingAlertText');
      if (!badge && !alertBox) return;

      try {
        let pCount = pendingCountParam;
        if (pCount === undefined) {
          const res = await fetch('/api/accounting/badge-counts', { headers: getAuthHeaders() });
          if (res.ok) {
            const data = await res.json();
            pCount = data.pendingCount !== undefined ? data.pendingCount : (data.count || 0);
          }
        }

        const count = Number(pCount) || 0;
        if (count <= 0) {
          if (badge) badge.style.display = 'none';
          if (alertBox) alertBox.style.display = 'none';
          return;
        }

        // Kiểm tra xem admin có đang ở tab cashbook không
        const activeTabBtn = document.querySelector('.side-nav button.active');
        const isCurrentCashbook = activeTabBtn && activeTabBtn.dataset.tab === 'cashbook';

        if (isCurrentCashbook) {
          if (badge) badge.style.display = 'none';
          if (alertBox) {
            alertBox.style.display = 'flex';
            if (alertText) alertText.textContent = `Có ${count} phiếu thu / chi vừa gửi đang chờ bạn xem xét và phê duyệt.`;
          }
          return;
        }

        const readTime = parseInt(localStorage.getItem('admin_cashbook_read_time') || '0', 10);
        const hasUnread = allCashbookEntries.some(e => e.status === 'pending' && new Date(e.createdAt || 0).getTime() > readTime);

        if (count > 0 && (hasUnread || !readTime)) {
          if (badge) {
            badge.textContent = count > 99 ? '99+' : count;
            badge.style.display = 'inline-block';
          }
        } else {
          if (badge) badge.style.display = 'none';
        }

        if (alertBox) {
          alertBox.style.display = 'flex';
          if (alertText) alertText.textContent = `Có ${count} phiếu thu / chi vừa gửi đang chờ bạn xem xét và phê duyệt.`;
        }
      } catch (e) {
        console.error('Lỗi kiểm tra badge sổ quỹ:', e);
      }
    }
    window.checkPendingCashbookBadge = checkPendingCashbookBadge;

    function filterPendingCashbook() {
      const st = document.getElementById('cashbookStatusFilter');
      if (st) st.value = 'pending';
      loadCashbook();
    }
    window.filterPendingCashbook = filterPendingCashbook;

    window.previewCashAttachedImage = function(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          const prevBox = document.getElementById('cashAttachedPreviewBox');
          const prevImg = document.getElementById('cashAttachedPreviewImg');
          const prevName = document.getElementById('cashAttachedPreviewName');
          if (prevBox) prevBox.style.display = 'flex';
          if (prevImg) prevImg.src = e.target.result;
          if (prevName) prevName.textContent = file.name;
          const attText = document.getElementById('cashAttached');
          if (attText && !attText.value.trim()) {
            attText.value = `Chứng từ ảnh: ${file.name}`;
          }
        };
        reader.readAsDataURL(file);
      }
    };

    window.removeCashAttachedImage = function() {
      const f = document.getElementById('cashAttachedFile');
      if (f) f.value = '';
      const imgHidden = document.getElementById('cashAttachedImage');
      if (imgHidden) imgHidden.value = '';
      const prevBox = document.getElementById('cashAttachedPreviewBox');

    async function loadCashbook() {
      const tbody = document.getElementById('cashbookTableBody');
      const infoEl = document.getElementById('cashbookCountInfo');
      if (tbody) tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:20px; white-space:nowrap;"><i class="fas fa-spinner fa-spin"></i> Đang tải sổ quỹ...</td></tr>';
      if (infoEl) infoEl.innerHTML = '<i class="fas fa-wallet" style="margin-right:6px; color:var(--navy-700);"></i>Đang tải sổ quỹ thu chi...';

      try {
        const params = new URLSearchParams();
        const typeVal = document.getElementById('cashbookTypeFilter')?.value;
        if (typeVal) params.append('type', typeVal);
        const statusVal = document.getElementById('cashbookStatusFilter')?.value;
        if (statusVal) params.append('status', statusVal);
        const searchVal = document.getElementById('cashbookSearchInput')?.value?.trim();
        if (searchVal) params.append('keyword', searchVal);
        const startVal = document.getElementById('cashbookStartDate')?.value;
        if (startVal) params.append('startDate', startVal);
        const endVal = document.getElementById('cashbookEndDate')?.value;
        if (endVal) params.append('endDate', endVal);

        const url = '/api/accounting/cashbook' + (params.toString() ? '?' + params.toString() : '');
        const res = await fetch(url, { headers: getAuthHeaders() });
        if (!res.ok) throw new Error('Không thể tải sổ quỹ');
        const d = await res.json();
        const entries = d.data || [];

        // Luôn xếp phiếu vừa gửi / mới lập lên đầu danh sách
        entries.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0) || String(b._id).localeCompare(String(a._id)));
        allCashbookEntries = entries;

        const totalIn = d.kpi ? d.kpi.totalIncome : entries.reduce((s, e) => s + (['income', 'thu'].includes(e.type) && (e.status || 'approved') === 'approved' ? Number(e.amount || 0) : 0), 0);
        const totalOut = d.kpi ? d.kpi.totalExpense : entries.reduce((s, e) => s + (['expense', 'chi'].includes(e.type) && (e.status || 'approved') === 'approved' ? Number(e.amount || 0) : 0), 0);
        const invCostVal = d.kpi && d.kpi.inventoryCostValue !== undefined 
          ? d.kpi.inventoryCostValue 
          : (d.kpi && d.kpi.currentBalance !== undefined ? Math.abs(d.kpi.currentBalance) : 6450262000);
        const pendingCount = d.kpi ? d.kpi.pendingCount : entries.filter(e => e.status === 'pending').length;

        const inEl = document.getElementById('cashTotalIncome');
        if (inEl) inEl.textContent = formatVND(totalIn);
        const outEl = document.getElementById('cashTotalExpense');
        if (outEl) outEl.textContent = formatVND(totalOut);
        const balEl = document.getElementById('cashBalance');
        if (balEl) balEl.textContent = formatVND(invCostVal);

        checkPendingCashbookBadge(pendingCount);

        if (entries.length === 0) {
          markTabLoaded('cashbook');
          tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:25px; color:var(--muted); white-space:nowrap;"><i class="fas fa-inbox fa-2x" style="display:block; margin-bottom:8px; opacity:0.5;"></i>Không có giao dịch thu chi nào phù hợp với bộ lọc</td></tr>';
          if (infoEl) infoEl.innerHTML = '<i class="fas fa-wallet" style="margin-right:6px; color:var(--navy-700);"></i>Không có giao dịch thu chi nào phù hợp';
          return;
        }

        if (infoEl) {
          infoEl.innerHTML = `<i class="fas fa-wallet" style="margin-right:6px; color:var(--navy-700);"></i>Hiển thị <strong>${entries.length.toLocaleString('vi-VN')}</strong> phiếu thu - chi`;
        }

        tbody.innerHTML = entries.map(e => {
          const isInc = ['income', 'thu'].includes(e.type);
          const badgeHtml = isInc 
            ? '<span class="badge b-active" style="white-space:nowrap;"><span class="badge-dot"></span> Phiếu Thu</span>'
            : '<span class="badge" style="background:#FEE2E2; color:#991B1B; font-weight:600; white-space:nowrap;"><span class="badge-dot" style="background:#EF4444;"></span> Phiếu Chi</span>';
          const codeDisplay = e.transactionCode || ('#' + (e._id || '').slice(-6).toUpperCase());
          const amountColor = isInc ? 'var(--color-emerald)' : 'var(--color-red)';
          const sign = isInc ? '+' : '-';
          const recipientDisplay = e.recipient || e.personName || '---';
          const catDisplay = e.category || (isInc ? 'Thu tiền bán sách' : 'Chi phí vận hành');

          const st = e.status || 'approved';
          let stBadge = '';
          let actionHtml = '';

          if (st === 'pending') {
            stBadge = '<span class="badge" style="background:#FEF3C7; color:#B45309; font-weight:600; white-space:nowrap;"><span class="badge-dot" style="background:#F59E0B;"></span> Chờ duyệt</span>';
            actionHtml = `
              <div style="display:inline-flex; gap:6px; justify-content:center; align-items:center; flex-wrap:nowrap; white-space:nowrap;">
                <button class="btn btn-sm" style="padding:4px 9px; font-size:12px; background:#10B981; color:#fff; border-color:#10B981; border-radius:5px; white-space:nowrap;" onclick="adminApproveCashbook('${e._id}', '${escapeHtml(codeDisplay)}')" title="Duyệt phiếu để thực thu/chi"><i class="fas fa-check"></i> Duyệt</button>
                <button class="btn btn-sm" style="padding:4px 9px; font-size:12px; background:#F8FAFC; color:#3B82F6; border-color:#3B82F6; border-radius:5px; white-space:nowrap;" onclick="adminEditCashbook('${e._id}')" title="Sửa phiếu"><i class="fas fa-edit"></i> Sửa</button>
                <button class="btn btn-sm" style="padding:4px 9px; font-size:12px; color:#EF4444; border-color:#EF4444; border-radius:5px; white-space:nowrap;" onclick="adminRejectCashbook('${e._id}', '${escapeHtml(codeDisplay)}')" title="Từ chối duyệt"><i class="fas fa-times"></i></button>
              </div>
            `;
          } else if (st === 'rejected') {
            stBadge = `<span class="badge" style="background:#FEE2E2; color:#B91C1C; font-weight:600; white-space:nowrap;" title="${escapeHtml(e.rejectionReason || 'Admin từ chối')}"><span class="badge-dot" style="background:#EF4444;"></span> Từ chối</span>`;
            actionHtml = `
              <div style="display:inline-flex; gap:6px; justify-content:center; align-items:center; flex-wrap:nowrap; white-space:nowrap;">
                <span style="color:#B91C1C; font-size:12px; font-weight:500; white-space:nowrap;"><i class="fas fa-ban"></i> Đã từ chối</span>
                <button class="btn btn-sm" style="padding:3px 7px; font-size:11.5px; color:#3B82F6; border-color:#3B82F6; border-radius:4px; white-space:nowrap;" onclick="adminEditCashbook('${e._id}')" title="Chỉnh sửa để gửi duyệt lại"><i class="fas fa-edit"></i></button>
              </div>
            `;
          } else {
            stBadge = '<span class="badge" style="background:#DCFCE7; color:#15803D; font-weight:600; white-space:nowrap;"><span class="badge-dot" style="background:#10B981;"></span> Đã duyệt</span>';
            actionHtml = `
              <div style="display:inline-flex; gap:6px; justify-content:center; align-items:center; flex-wrap:nowrap; white-space:nowrap;">
                <span style="color:var(--muted); font-size:12px; white-space:nowrap;"><i class="fas fa-check-circle" style="color:#10B981;"></i> Đã hạch toán</span>
                <button class="btn btn-sm" style="padding:3px 7px; font-size:11.5px; color:#3B82F6; border-color:#3B82F6; border-radius:4px; white-space:nowrap;" onclick="adminEditCashbook('${e._id}')" title="Chỉnh sửa thông tin phiếu"><i class="fas fa-edit"></i></button>
              </div>
            `;
          }

          // 1. Phân loại màu và giới hạn độ dài cho Người nộp / Người nhận:
          const personPillHtml = isInc
            ? `<span class="cash-person-pill" style="display:inline-flex; align-items:center; gap:5px; max-width:185px; background:#ECFDF5; color:#065F46; border:1px solid #A7F3D0; padding:3px 8px; border-radius:6px; font-weight:600; font-size:12px; vertical-align:middle; white-space:nowrap;" title="Người nộp: ${escapeHtml(recipientDisplay)}">
                <i class="fas fa-arrow-circle-down" style="color:#059669; font-size:11px; flex-shrink:0;"></i>
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(recipientDisplay)}</span>
              </span>`
            : `<span class="cash-person-pill" style="display:inline-flex; align-items:center; gap:5px; max-width:185px; background:#FFF7ED; color:#9A3412; border:1px solid #FED7AA; padding:3px 8px; border-radius:6px; font-weight:600; font-size:12px; vertical-align:middle; white-space:nowrap;" title="Người nhận: ${escapeHtml(recipientDisplay)}">
                <i class="fas fa-arrow-circle-up" style="color:#EA580C; font-size:11px; flex-shrink:0;"></i>
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(recipientDisplay)}</span>
              </span>`;

          // 2. Chứng từ: Nếu có ảnh đính kèm thì hiển thị tên chứng từ màu xanh, click vào xem ảnh và xóa chữ Xem ảnh riêng
          let certHtml = '';
          const docText = e.attached || (e.attachedImage ? 'Chứng từ ảnh' : '');

          if (e.attachedImage) {
            certHtml = `
              <a href="${escapeHtml(e.attachedImage)}" target="_blank" class="cash-cert-link" 
                 style="display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:#1D4ED8; background:#EFF6FF; border:1px solid #BFDBFE; padding:3px 8px; border-radius:6px; font-weight:600; text-decoration:none; vertical-align:middle; white-space:nowrap; max-width:170px;" 
                 title="Nhấn để xem ảnh chứng từ: ${escapeHtml(docText)}">
                <i class="fas fa-image" style="color:#2563EB; font-size:11px; flex-shrink:0;"></i>
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(docText)}</span>
              </a>
            `;
          } else if (docText) {
            certHtml = `
              <span style="display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:#475569; background:#F1F5F9; border:1px solid #CBD5E1; padding:3px 8px; border-radius:6px; vertical-align:middle; white-space:nowrap; max-width:170px;" 
                    title="Chứng từ đính kèm: ${escapeHtml(docText)}">
                <i class="fas fa-paperclip" style="color:#64748B; font-size:11px; flex-shrink:0;"></i>
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(docText)}</span>
              </span>
            `;
          } else {
            certHtml = '<span style="color:var(--muted); font-size:12px; font-style:italic; white-space:nowrap;">---</span>';
          }

          // 3. Diễn giải riêng với giới hạn độ dài:
          const fullDesc = e.description || e.note || '---';

          return `
            <tr>
              <td class="id-cell" style="white-space:nowrap;"><strong>${escapeHtml(codeDisplay)}</strong></td>
              <td style="white-space:nowrap; text-align:center;">${badgeHtml}</td>
              <td style="white-space:nowrap;">
                <strong style="white-space:nowrap;" title="${escapeHtml(catDisplay)}">${escapeHtml(catDisplay)}</strong>
              </td>
              <td class="amount" style="color:${amountColor}; font-weight:700; white-space:nowrap; text-align:right;">
                ${sign}${formatVND(e.amount)}
              </td>
              <td style="white-space:nowrap; text-align:center;">${stBadge}</td>
              <td style="white-space:nowrap;">${personPillHtml}</td>
              <td style="white-space:nowrap; text-align:center;">${renderPaymentBadge(e.paymentMethod)}</td>
              <td style="white-space:nowrap; text-align:center;">${formatDateTime(e.createdAt)}</td>
              <td style="white-space:nowrap;">
                <div style="max-width:245px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text);" title="${escapeHtml(fullDesc)}">
                  ${escapeHtml(fullDesc)}
                </div>
              </td>
              <td style="white-space:nowrap; text-align:center;">${certHtml}</td>
              <td style="text-align:center; white-space:nowrap;">${actionHtml}</td>
            </tr>
          `;
        }).join('');
        markTabLoaded('cashbook');
      } catch (err) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:20px; color:var(--danger); white-space:nowrap;">' + err.message + '</td></tr>';
        if (infoEl) infoEl.innerHTML = '<i class="fas fa-exclamation-triangle" style="margin-right:6px; color:var(--danger);"></i>Lỗi tải sổ quỹ';
      }
    }

    window.adminApproveCashbook = async function(id, code) {
      if (confirm(`Bạn có chắc chắn muốn PHÊ DUYỆT phiếu "${code}" để chính thức thực hiện thu/chi tiền vào quỹ?`)) {
        try {
          const res = await fetch(`/api/accounting/transactions/${id}/approve`, {
            method: 'PUT',
            headers: getAuthHeaders({ 'Content-Type': 'application/json' })
          });
          const d = await res.json();
          if (res.ok && d.success) {
            showCustomToast(d.message || 'Đã duyệt phiếu thành công!', 'success');
            loadCashbook();
            checkPendingCashbookBadge();
          } else {
            showCustomToast(d.message || 'Không thể duyệt phiếu', 'error');
          }
        } catch (err) {
          showCustomToast('Lỗi kết nối máy chủ', 'error');
        }
      }
    };

    window.adminRejectCashbook = async function(id, code) {
      const reason = prompt(`Nhập lý do từ chối phiếu "${code}":`, 'Không đủ chứng từ hợp lệ');
      if (reason === null) return;
      try {
        const res = await fetch(`/api/accounting/transactions/${id}/reject`, {
          method: 'PUT',
          headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ reason: reason.trim() })
        });
        const d = await res.json();
        if (res.ok && d.success) {
          showCustomToast(d.message || 'Đã từ chối duyệt phiếu', 'info');
          loadCashbook();
          checkPendingCashbookBadge();
        } else {
          showCustomToast(d.message || 'Không thể từ chối phiếu', 'error');
        }
      } catch (err) {
        showCustomToast('Lỗi kết nối máy chủ', 'error');
      }
    };

    window.adminEditCashbook = async function(id) {
      let e = (allCashbookEntries || []).find(item => item._id === id);
      if (!e) {
        try {
          const res = await fetch(`/api/accounting/cashbook`, { headers: getAuthHeaders() });
          const d = await res.json();
          if (d.data) {
            allCashbookEntries = d.data;
            e = allCashbookEntries.find(item => item._id === id);
          }
        } catch (err) {
          console.error(err);
        }
      }
      if (!e) {
        showCustomToast('Không tìm thấy thông tin phiếu', 'error');
        return;
      }

      document.getElementById('cashEditId').value = e._id;
      const titleEl = document.getElementById('cashModalTitle');
      if (titleEl) titleEl.textContent = `Chỉnh Sửa Phiếu Thu / Chi (${e.transactionCode || 'Phiếu'})`;
      const submitBtn = document.getElementById('cashSubmitBtn');
      if (submitBtn) submitBtn.textContent = 'Lưu thay đổi';

      const typeEl = document.getElementById('cashType');
      if (typeEl) {
        typeEl.value = ['income', 'thu'].includes(e.type) ? 'income' : 'expense';
        onCashTypeChanged();
      }

      const dateEl = document.getElementById('cashCreatedAt');
      if (dateEl) {
        dateEl.value = getLocalDateTimeString(e.createdAt ? new Date(e.createdAt) : new Date());
      }

      const amtEl = document.getElementById('cashAmount');
      if (amtEl) amtEl.value = e.amount || 0;

      const methodEl = document.getElementById('cashPaymentMethod');
      if (methodEl) {
        const m = (e.paymentMethod || 'cash').toLowerCase();
        methodEl.value = ['transfer', 'chuyển khoản', 'banking'].includes(m) ? 'transfer' : (['momo', 'ví momo'].includes(m) ? 'momo' : 'cash');
      }

      const catEl = document.getElementById('cashCategory');
      if (catEl) catEl.value = e.category || '';

      const recEl = document.getElementById('cashRecipient');
      if (recEl) recEl.value = e.recipient || e.personName || '';

      const descEl = document.getElementById('cashDescription');
      if (descEl) descEl.value = e.description || e.note || '';

      const attEl = document.getElementById('cashAttached');
      if (attEl) attEl.value = e.attached || '';

      const imgHidden = document.getElementById('cashAttachedImage');
      if (imgHidden) imgHidden.value = e.attachedImage || '';

      const prevBox = document.getElementById('cashAttachedPreviewBox');
      const prevImg = document.getElementById('cashAttachedPreviewImg');
      const prevName = document.getElementById('cashAttachedPreviewName');
      if (e.attachedImage) {
        if (prevBox) prevBox.style.display = 'flex';
        if (prevImg) prevImg.src = e.attachedImage;
        if (prevName) prevName.textContent = e.attachedImage.split('/').pop() || 'Ảnh chứng từ';
      } else {
        if (prevBox) prevBox.style.display = 'none';
      }

      openModal('cashbookModal');
    };

    function resetCashbookFilter() {
      const s = document.getElementById('cashbookSearchInput');
      if (s) s.value = '';
      const t = document.getElementById('cashbookTypeFilter');
      if (t) t.value = '';
      const st = document.getElementById('cashbookStatusFilter');
      if (st) st.value = '';
      const sd = document.getElementById('cashbookStartDate');
      if (sd) sd.value = '';
      const ed = document.getElementById('cashbookEndDate');
      if (ed) ed.value = '';
      loadCashbook();
    }

    function openCashbookModal() {
      try {
        const editIdEl = document.getElementById('cashEditId');
        if (editIdEl) editIdEl.value = '';

        const titleEl = document.getElementById('cashModalTitle');
        if (titleEl) titleEl.textContent = 'Lập Phiếu Thu / Chi Tiền Mặt & Ngân Hàng';

        const submitBtn = document.getElementById('cashSubmitBtn');
        if (submitBtn) submitBtn.textContent = 'Lập phiếu giao dịch';

        const typeEl = document.getElementById('cashType');
        if (typeEl) {
          typeEl.value = 'income';
          if (typeof onCashTypeChanged === 'function') onCashTypeChanged();
        }

        const dateEl = document.getElementById('cashCreatedAt');
        if (dateEl) dateEl.value = getLocalDateTimeString(new Date());

        const amtEl = document.getElementById('cashAmount');
        if (amtEl) amtEl.value = '';

        const methodEl = document.getElementById('cashPaymentMethod');
        if (methodEl) methodEl.value = 'cash';

        const catEl = document.getElementById('cashCategory');
        if (catEl) catEl.value = '';

        const recEl = document.getElementById('cashRecipient');
        if (recEl) recEl.value = '';

          select.innerHTML = '<option value="">-- Không liên kết NCC hoặc chi đối tác khác --</option>' + (allSuppliersCache || []).map(s => `<option value="${s._id}">${s.name} (${s.code || 'NCC'})</option>`).join('');

      } else {
        grp.style.display = 'none';
        const hint = document.getElementById('cashSupplierBankHint');
        if (hint) hint.style.display = 'none';
        const sel = document.getElementById('cashSupplierSelect');
        if (sel) sel.value = '';

    function onCashSupplierChanged(supId) {
      const hint = document.getElementById('cashSupplierBankHint');
      const recipientInput = document.getElementById('cashRecipient');
      const categoryInput = document.getElementById('cashCategory');
      if (!supId) {
        if (hint) hint.style.display = 'none';
        return;
      }
      const sup = (allSuppliersCache || []).find(s => s._id === supId);
      if (sup) {
        if (recipientInput) {
          recipientInput.value = sup.name + (sup.contactPerson ? ` (${sup.contactPerson})` : '');
        }
        if (categoryInput && (!categoryInput.value || categoryInput.value.startsWith('Thanh toán tiền hàng cho'))) {
          categoryInput.value = `Thanh toán tiền hàng cho ${sup.name}`;
        }
        if (sup.bankAccount && (sup.bankAccount.bankName || sup.bankAccount.accountNumber)) {
          if (hint) {
            hint.style.display = 'block';
            hint.innerHTML = `<i class="fas fa-university"></i> <strong>STK:</strong> ${sup.bankAccount.accountNumber || '---'} | <strong>Ngân hàng:</strong> ${sup.bankAccount.bankName || '---'} | <strong>Chủ TK:</strong> ${sup.bankAccount.accountHolder || sup.name}`;
          }
        } else {
          if (hint) {
            hint.style.display = 'block';
            hint.innerHTML = `<i class="fas fa-info-circle"></i> NCC chưa cập nhật thông tin tài khoản ngân hàng.`;
          }
        }
      }
    }

    async function submitCashbookForm() {
      const editId = document.getElementById('cashEditId')?.value;
      const isEdit = Boolean(editId);
      const type = document.getElementById('cashType').value;
      const amount = Number(document.getElementById('cashAmount').value);
      const paymentMethod = document.getElementById('cashPaymentMethod').value;
      const category = document.getElementById('cashCategory').value.trim();
      const recipient = document.getElementById('cashRecipient').value.trim();
      const description = document.getElementById('cashDescription').value.trim();
      const attached = document.getElementById('cashAttached').value.trim();
      const attachedImageHidden = document.getElementById('cashAttachedImage').value.trim();
      const attachedFileInput = document.getElementById('cashAttachedFile');
      const hasNewFile = attachedFileInput && attachedFileInput.files && attachedFileInput.files[0];

      if (!amount || amount <= 0 || !category) {
        showCustomToast('Vui lòng nhập số tiền và hạng mục thu chi!', 'warning');
        return;
      }

      // Kèm theo chứng từ gốc là bắt buộc (lời hoặc ảnh)
      if (!attached && !attachedImageHidden && !hasNewFile) {
        showCustomToast('Kèm theo chứng từ gốc là bắt buộc! Vui lòng nhập lời ghi chú hoặc chọn ảnh.', 'warning');
        document.getElementById('cashAttached').focus();
        return;
      }

      let finalAttachedImageUrl = attachedImageHidden;
      if (hasNewFile) {
        const btn = document.getElementById('cashSubmitBtn');
        const origText = btn ? btn.textContent : '';
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Đang tải ảnh...';
        }
        try {
          const fd = new FormData();
          fd.append('attachment', attachedFileInput.files[0]);
          const upRes = await fetch('/api/accounting/upload-attachment', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: fd
          });
          const upData = await upRes.json();
          if (upRes.ok && upData.success && upData.url) {
            finalAttachedImageUrl = upData.url;
          } else {
            showCustomToast(upData.message || 'Không thể tải lên ảnh chứng từ', 'error');
            if (btn) {
              btn.disabled = false;
              btn.textContent = origText;
            }
            return;
          }
        } catch (err) {
          showCustomToast('Lỗi tải ảnh chứng từ lên máy chủ', 'error');
          if (btn) {
            btn.disabled = false;
            btn.textContent = origText;
          }
          return;
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = origText;
        }
      }

      const dateVal = document.getElementById('cashCreatedAt')?.value;
      let finalCreatedAt = new Date().toISOString();
      if (dateVal) {
        const parsed = new Date(dateVal);
        if (!isNaN(parsed.getTime())) {
          finalCreatedAt = parsed.toISOString();
        }
      }

      const payload = {
        type,
        amount,
        paymentMethod,
        category,
        recipient,
        personName: recipient,
        description,
        attached: attached || (finalAttachedImageUrl ? 'Chứng từ đính kèm (ảnh)' : 'Có chứng từ gốc'),
        attachedImage: finalAttachedImageUrl,
        createdAt: finalCreatedAt
      };

      try {
        const url = isEdit ? `/api/accounting/transactions/${editId}` : '/api/accounting/cashbook';
        const method = isEdit ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(payload)
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.message || (isEdit ? 'Lỗi cập nhật phiếu' : 'Lỗi lập phiếu sổ quỹ'));

        showCustomToast(d.message || (isEdit ? 'Cập nhật phiếu thành công!' : 'Lập phiếu sổ quỹ thành công!'), 'success');
        closeModal('cashbookModal');
        loadCashbook();
        checkPendingCashbookBadge();
      } catch (err) {
        showCustomToast(err.message, 'error');
      }
    }

        // Cập nhật bảng kết quả kinh doanh & tồn kho chuẩn xác

        const ctx = document.getElementById('financialChart');
        if (ctx) {
          if (financialChartInstance) financialChartInstance.destroy();

            type: 'bar',

    function previewSettingQr(input, previewImgId, fileNameId) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        if (file.size > 3 * 1024 * 1024) {
          showCustomToast('Dung lượng ảnh mã QR không được vượt quá 3MB!', 'warning');
          input.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.getElementById(previewImgId);
          if (img) img.src = e.target.result;
        };
        reader.readAsDataURL(file);

        const fileNameEl = document.getElementById(fileNameId);
        if (fileNameEl) {
          fileNameEl.textContent = 'Đã chọn: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
          fileNameEl.style.color = '#15803D';
          fileNameEl.style.fontWeight = '600';
        }
      }
    }

      try {
        const res = await fetch('/api/settings');
        if (!res.ok) return;
        const d = await res.json();
        const s = d.data || d || {};

        if (s.storeInfo) {
          if (s.storeInfo.storeName && document.getElementById('settingStoreName')) document.getElementById('settingStoreName').value = s.storeInfo.storeName;
          if (s.storeInfo.hotline && document.getElementById('settingHotline')) document.getElementById('settingHotline').value = s.storeInfo.hotline;
          if (s.storeInfo.email && document.getElementById('settingEmail')) document.getElementById('settingEmail').value = s.storeInfo.email;
          if (s.storeInfo.address && document.getElementById('settingAddress')) document.getElementById('settingAddress').value = s.storeInfo.address;
          if (s.storeInfo.openHours && document.getElementById('settingOpenHours')) document.getElementById('settingOpenHours').value = s.storeInfo.openHours;
        }

        if (s.bankAccount) {
          if (s.bankAccount.bankName && document.getElementById('settingBankName')) document.getElementById('settingBankName').value = s.bankAccount.bankName;
          if (s.bankAccount.accountNumber && document.getElementById('settingBankAccountNumber')) document.getElementById('settingBankAccountNumber').value = s.bankAccount.accountNumber;
          if (s.bankAccount.accountHolder && document.getElementById('settingBankAccountHolder')) document.getElementById('settingBankAccountHolder').value = s.bankAccount.accountHolder;
        }

        if (s.momo) {
          if (s.momo.phone && document.getElementById('settingMomoPhone')) document.getElementById('settingMomoPhone').value = s.momo.phone;
          if (s.momo.holder && document.getElementById('settingMomoHolder')) document.getElementById('settingMomoHolder').value = s.momo.holder;
        }

        // Tải ảnh mã VietQR & MoMo
        const bankQrImg = s.bankQrImage || s.bankAccount?.qrImage || '/images/qr-bank.jpg';
        const momoQrImg = s.momoQrImage || s.momo?.qrImage || '/images/qr-momo.jpg';

        const bankPreview = document.getElementById('settingBankQrPreview');
        if (bankPreview) bankPreview.src = bankQrImg;

        const momoPreview = document.getElementById('settingMomoQrPreview');
        if (momoPreview) momoPreview.src = momoQrImg;

        // Tải danh sách Hero Banners
        currentHeroBanners = (s.heroBanners && Array.isArray(s.heroBanners) && s.heroBanners.length > 0)
          ? JSON.parse(JSON.stringify(s.heroBanners))
          : getDefaultHeroBannersList();
        bannerFiles = {};
        renderHeroBannersEditor();
        markTabLoaded('system-settings');

      } catch (err) {
        console.error('loadSystemSettings error:', err);
      }

    function syncHeroBannersFromInputs() {
      currentHeroBanners.forEach((banner, idx) => {
        const badgeEl = document.getElementById(`heroBannerBadge_${idx}`);
        const titleEl = document.getElementById(`heroBannerTitle_${idx}`);
        const descEl = document.getElementById(`heroBannerDesc_${idx}`);
        const linkEl = document.getElementById(`heroBannerLink_${idx}`);
        const imgUrlEl = document.getElementById(`heroBannerImageUrl_${idx}`);

        if (badgeEl) banner.badge = badgeEl.value.trim();
        if (titleEl) banner.title = titleEl.value.trim();
        if (descEl) banner.description = descEl.value.trim();
        if (linkEl) banner.linkUrl = linkEl.value.trim();
        if (imgUrlEl && imgUrlEl.value.trim() && !bannerFiles[idx]) {
          banner.image = imgUrlEl.value.trim();
        }
      });
    }

                </button>
                <button type="button" class="btn btn-sm" onclick="removeHeroBanner(${idx})" style="background: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5; cursor: pointer; padding: 5px 10px;" title="Xóa slide banner này">

                    <span id="heroBannerOverlayBadge_${idx}" style="color: #F59E0B; font-weight: 700;">${escapeHtml(banner.badge || 'TAG')}</span>: <span id="heroBannerOverlayTitle_${idx}">${escapeHtml(banner.title || 'Tiêu đề')}</span>

    function updateHeroBannerMemory(idx) {
      if (!currentHeroBanners[idx]) return;
      const badgeVal = document.getElementById(`heroBannerBadge_${idx}`)?.value.trim() || '';
      const titleVal = document.getElementById(`heroBannerTitle_${idx}`)?.value.trim() || '';
      const descVal = document.getElementById(`heroBannerDesc_${idx}`)?.value.trim() || '';
      const linkVal = document.getElementById(`heroBannerLink_${idx}`)?.value.trim() || '/products';

      currentHeroBanners[idx].badge = badgeVal;
      currentHeroBanners[idx].title = titleVal;
      currentHeroBanners[idx].description = descVal;
      currentHeroBanners[idx].linkUrl = linkVal;

      const cardTitleEl = document.getElementById(`heroBannerCardTitle_${idx}`);
      if (cardTitleEl) cardTitleEl.textContent = titleVal || 'Banner Chưa Đặt Tên';
      const overlayBadgeEl = document.getElementById(`heroBannerOverlayBadge_${idx}`);
      if (overlayBadgeEl) overlayBadgeEl.textContent = badgeVal || 'TAG';
      const overlayTitleEl = document.getElementById(`heroBannerOverlayTitle_${idx}`);
      if (overlayTitleEl) overlayTitleEl.textContent = titleVal || 'Tiêu đề';
    }

    function handleHeroBannerFileSelect(idx, inputEl) {
      if (!inputEl || !inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];
      if (file.size > 10 * 1024 * 1024) {
        showCustomToast('Kích thước ảnh không được vượt quá 10MB', 'warning');
        inputEl.value = '';
        return;
      }

      bannerFiles[idx] = file;

      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById(`heroBannerPreview_${idx}`);
        if (preview) preview.src = e.target.result;
        const statusEl = document.getElementById(`heroBannerFileStatus_${idx}`);
        if (statusEl) {
          statusEl.innerHTML = `<span style="color:#10B981; font-weight:600;"><i class="fas fa-check-circle"></i> Đã chọn file mới: ${escapeHtml(file.name)}</span>`;
        }
      };
      reader.readAsDataURL(file);
    }

    function handleHeroBannerUrlChange(idx, newUrl) {
      if (!currentHeroBanners[idx]) return;
      const trimmed = newUrl.trim();
      if (trimmed) {
        currentHeroBanners[idx].image = trimmed;
        delete bannerFiles[idx];
        const preview = document.getElementById(`heroBannerPreview_${idx}`);
        if (preview) preview.src = trimmed;
        const statusEl = document.getElementById(`heroBannerFileStatus_${idx}`);
        if (statusEl) statusEl.textContent = 'Đang dùng link ảnh URL online';
      }
    }

    function addNewHeroBannerItem() {
      syncHeroBannersFromInputs();
      currentHeroBanners.push({
        image: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=1920&q=85',
        badge: 'TÁC PHẨM MỚI',
        title: 'Tựa Sách Nổi Bật',
        description: 'Giới thiệu tác phẩm đặc sắc tại Hiệu sách L\'Amour — Đọc thử và khám phá ngay.',
        linkUrl: '/products'
      });
      renderHeroBannersEditor();
      showCustomToast('Đã thêm 1 banner mới. Hãy nhập nội dung và bấm "Lưu cài đặt".', 'info');
      setTimeout(() => {
        const container = document.getElementById('heroBannersContainer');
        if (container && container.lastElementChild) {
          container.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, 60);
    }

    function removeHeroBanner(idx) {
      syncHeroBannersFromInputs();
      if (currentHeroBanners.length <= 1) {
        if (!confirm('Bạn có chắc muốn xóa banner này? Trang chủ sẽ không còn banner nào.')) return;
      }
      currentHeroBanners.splice(idx, 1);
      const newFiles = {};
      Object.keys(bannerFiles).forEach(k => {
        const intK = parseInt(k, 10);
        if (intK < idx) newFiles[intK] = bannerFiles[intK];
        else if (intK > idx) newFiles[intK - 1] = bannerFiles[intK];
      });
      bannerFiles = newFiles;
      renderHeroBannersEditor();
      showCustomToast('Đã xóa banner khỏi danh sách.', 'info');
    }

    function moveHeroBanner(idx, dir) {
      syncHeroBannersFromInputs();
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= currentHeroBanners.length) return;

      const temp = currentHeroBanners[idx];
      currentHeroBanners[idx] = currentHeroBanners[targetIdx];
      currentHeroBanners[targetIdx] = temp;

      const f1 = bannerFiles[idx];
      const f2 = bannerFiles[targetIdx];
      if (f1) bannerFiles[targetIdx] = f1; else delete bannerFiles[targetIdx];
      if (f2) bannerFiles[idx] = f2; else delete bannerFiles[idx];

      renderHeroBannersEditor();
    }

    function resetDefaultHeroBanners() {
      if (!confirm('Khôi phục danh sách về 4 banner sách kinh điển mặc định (Trăm Năm Cô Đơn, Nhà Giả Kim, Rừng Na Uy, Hoàng Tử Bé)?')) return;
      currentHeroBanners = getDefaultHeroBannersList();
      bannerFiles = {};
      renderHeroBannersEditor();
      showCustomToast('Đã khôi phục danh sách mẫu gốc. Nhớ bấm "Lưu cài đặt" để áp dụng!', 'info');
    }

    async function saveSystemSettings() {
      const storeInfo = {
        storeName: document.getElementById('settingStoreName')?.value.trim() || '',
        hotline: document.getElementById('settingHotline')?.value.trim() || '',
        email: document.getElementById('settingEmail')?.value.trim() || '',
        address: document.getElementById('settingAddress')?.value.trim() || '',
        openHours: document.getElementById('settingOpenHours')?.value.trim() || ''
      };

      const bankAccount = {
        bankName: document.getElementById('settingBankName')?.value.trim() || '',
        accountNumber: document.getElementById('settingBankAccountNumber')?.value.trim() || '',
        accountHolder: document.getElementById('settingBankAccountHolder')?.value.trim() || ''
      };

      const momo = {
        phone: document.getElementById('settingMomoPhone')?.value.trim() || '',
        holder: document.getElementById('settingMomoHolder')?.value.trim() || ''
      };

      syncHeroBannersFromInputs();

      const formData = new FormData();
      formData.append('storeInfo', JSON.stringify(storeInfo));
      formData.append('bankAccount', JSON.stringify(bankAccount));
      formData.append('momo', JSON.stringify(momo));
      formData.append('heroBanners', JSON.stringify(currentHeroBanners));

      const bankFileInput = document.getElementById('settingBankQrFile');
      if (bankFileInput && bankFileInput.files && bankFileInput.files[0]) {
        formData.append('bankQrImage', bankFileInput.files[0]);
      }

      const momoFileInput = document.getElementById('settingMomoQrFile');
      if (momoFileInput && momoFileInput.files && momoFileInput.files[0]) {
        formData.append('momoQrImage', momoFileInput.files[0]);
      }

      // Đính kèm các file ảnh tải lên cho banner
      Object.keys(bannerFiles).forEach(key => {
        if (bannerFiles[key]) {
          formData.append('bannerImage_' + key, bannerFiles[key]);
        }
      });

      try {
        const res = await fetch('/api/settings', {
          method: 'PUT',
          headers: getAuthHeaders(),
          body: formData
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.message || 'Lỗi lưu cấu hình hệ thống');

        showCustomToast('Cấu hình hệ thống và danh sách Banner đã được lưu thành công!', 'success');

        // Reset file input label
        const bankNameEl = document.getElementById('settingBankQrFileName');
        if (bankNameEl) {
          bankNameEl.textContent = 'Chưa chọn ảnh mới (Đang dùng ảnh hiện tại)';
          bankNameEl.style.color = 'var(--muted)';
          bankNameEl.style.fontWeight = 'normal';
        }
        const momoNameEl = document.getElementById('settingMomoQrFileName');
        if (momoNameEl) {
          momoNameEl.textContent = 'Chưa chọn ảnh mới (Đang dùng ảnh hiện tại)';
          momoNameEl.style.color = 'var(--muted)';
          momoNameEl.style.fontWeight = 'normal';
        }

        if (d.data) {
          if (d.data.bankQrImage && document.getElementById('settingBankQrPreview')) {
            document.getElementById('settingBankQrPreview').src = d.data.bankQrImage;
          }
          if (d.data.momoQrImage && document.getElementById('settingMomoQrPreview')) {
            document.getElementById('settingMomoQrPreview').src = d.data.momoQrImage;
          }
          if (d.data.heroBanners && Array.isArray(d.data.heroBanners)) {
            currentHeroBanners = JSON.parse(JSON.stringify(d.data.heroBanners));
            bannerFiles = {};
            renderHeroBannersEditor();
          }
        }
      } catch (err) {
        showCustomToast(err.message, 'error');
      }
    }

    // =========================================================================
    // --- MODULE: QUẢN LÝ MÃ GIẢM GIÁ (COUPONS / VOUCHERS) ---
    // =========================================================================
    let allCouponsCache = [];
    let couponDebounceTimer = null;

    function debounceCoupons() {
      if (couponDebounceTimer) clearTimeout(couponDebounceTimer);
      couponDebounceTimer = setTimeout(() => {
        loadCoupons();
      }, 300);
    }

    async function loadCoupons() {
      const tbody = document.getElementById('couponTableBody');
      if (!tbody) return;

      const search = document.getElementById('couponSearchInput')?.value?.trim() || '';
      const status = document.getElementById('couponStatusFilter')?.value || 'all';
      const discountType = document.getElementById('couponTypeFilter')?.value || 'all';

      tbody.innerHTML = '<tr><td colspan="8" class="empty-cell">Đang tải danh sách mã giảm giá...</td></tr>';

      try {
        const params = new URLSearchParams();
        if (search) params.append('search', search);
        if (status && status !== 'all') params.append('status', status);
        if (discountType && discountType !== 'all') params.append('discountType', discountType);

        const res = await fetch('/api/coupons?' + params.toString(), {
          headers: getAuthHeaders()
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (!json.success) throw new Error(json.message || 'Lỗi tải mã giảm giá');

        allCouponsCache = json.data || [];

        // Cập nhật KPI
        if (json.kpi) {
          const kpi = json.kpi;
          const totalEl = document.getElementById('couponKpiTotal');
          const activeEl = document.getElementById('couponKpiActive');
          const usedEl = document.getElementById('couponKpiUsed');
          const expEl = document.getElementById('couponKpiExpired');
          if (totalEl) totalEl.textContent = kpi.totalCoupons || 0;
          if (activeEl) activeEl.textContent = kpi.activeCoupons || 0;
          if (usedEl) usedEl.textContent = kpi.totalUsedCount || 0;
          if (expEl) expEl.textContent = kpi.expiredOrExhaustedCoupons || 0;
        }

        renderCouponsTable(allCouponsCache);
        markTabLoaded('coupons');
      } catch (err) {
        console.error('Lỗi loadCoupons:', err);
        tbody.innerHTML = '<tr><td colspan="8" class="empty-cell" style="color:var(--danger);">' + (err.message || 'Lỗi khi tải mã giảm giá') + '</td></tr>';
      }
    }

    function renderCouponsTable(coupons) {
      const tbody = document.getElementById('couponTableBody');
      if (!tbody) return;

      if (!coupons || coupons.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-cell" style="padding:32px; text-align:center;">' +
          '<div style="font-size:32px; color:var(--muted); margin-bottom:8px;"><i class="fas fa-ticket-alt"></i></div>' +
          '<div style="font-weight:600; color:var(--navy-900);">Chưa có mã giảm giá nào phù hợp</div>' +
          '<div style="font-size:12.5px; color:var(--muted); margin-top:4px;">Hãy tạo mới mã ưu đãi để kích cầu bán hàng!</div>' +
          '<button class="btn btn-primary" onclick="openCouponModal()" style="margin-top:12px;"><i class="fas fa-plus"></i> Tạo mã đầu tiên</button>' +
        '</td></tr>';
        return;
      }

      const now = new Date();

      tbody.innerHTML = coupons.map(c => {
        const isExpired = c.endDate && new Date(c.endDate) < now;
        const isExhausted = c.usageLimit && c.usedCount >= c.usageLimit;
        const remaining = Math.max(0, (c.usageLimit || 0) - (c.usedCount || 0));
        const usagePct = c.usageLimit > 0 ? Math.min(100, Math.round((c.usedCount / c.usageLimit) * 100)) : 0;

        // Trạng thái badge
        let statusBadge = '';
        if (isExpired) {
          statusBadge = '<span class="badge b-locked">Đã hết hạn</span>';
        } else if (isExhausted) {
          statusBadge = '<span class="badge" style="background:#FEE2E2; color:#991B1B;">Hết lượt</span>';
        } else if (!c.isActive) {
          statusBadge = '<span class="badge" style="background:#F1F5F9; color:#64748B;">Tạm dừng</span>';
        } else {
          statusBadge = '<span class="badge badge-success">Đang hiệu lực</span>';
        }

        // Mức giảm hiển thị
        let discountDisplay = '';
        if (c.discountType === 'percent') {
          discountDisplay = '<strong style="color:var(--gold-dark);">' + c.discountValue + '%</strong>' +
            (c.maxDiscountAmount > 0 ? ' <span style="font-size:11px; color:var(--muted);">(Tối đa ' + formatVND(c.maxDiscountAmount) + ')</span>' : '');
        } else {
          discountDisplay = '<strong style="color:var(--gold-dark);">' + formatVND(c.discountValue) + '</strong>';
        }

        const minOrderDisplay = (c.minOrderValue && c.minOrderValue > 0)
          ? formatVND(c.minOrderValue)
          : '<span style="color:var(--muted); font-size:12px;">Mọi đơn hàng</span>';

        const dateRange = (c.startDate ? new Date(c.startDate).toLocaleDateString('vi-VN') : '---') + ' → ' +
          (c.endDate ? new Date(c.endDate).toLocaleDateString('vi-VN') : '---');

        return '<tr>' +
          '<td>' +
            '<span style="display:inline-block; font-family:Consolas, monospace; font-size:13px; font-weight:700; background:#FEF3C7; color:#92400E; padding:4px 9px; border-radius:6px; border:1px dashed #F59E0B; letter-spacing:0.05em;">' +
              c.code +
            '</span>' +
          '</td>' +
          '<td>' +
            '<div style="font-weight:600; color:var(--navy-900);">' + (c.name || 'Ưu đãi') + '</div>' +
            (c.description ? '<div style="font-size:11.5px; color:var(--muted); margin-top:2px;">' + c.description + '</div>' : '') +
          '</td>' +
          '<td>' + discountDisplay + '</td>' +
          '<td>' + minOrderDisplay + '</td>' +
          '<td>' +
            '<div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;">' +
              '<span><strong>' + c.usedCount + '</strong> / ' + c.usageLimit + '</span>' +
              '<span style="color:var(--muted); font-size:11px;">Còn ' + remaining + '</span>' +
            '</div>' +
            '<div style="height:6px; background:#E2E8F0; border-radius:99px; overflow:hidden;">' +
              '<div style="height:100%; width:' + usagePct + '%; background:' + (usagePct >= 90 ? '#DC2626' : (usagePct >= 60 ? 'var(--gold)' : 'var(--emerald)')) + '; border-radius:99px;"></div>' +
            '</div>' +
          '</td>' +
          '<td style="font-size:12px; color:#475569;">' + dateRange + '</td>' +
          '<td style="text-align:center;">' + statusBadge + '</td>' +
          '<td style="text-align:right; white-space:nowrap;">' +
            '<button class="btn btn-sm btn-secondary" title="Chỉnh sửa mã" data-id="' + c._id + '" onclick="openCouponModal(this.dataset.id)" style="padding:4px 8px; margin-right:4px;">' +
              '<i class="fas fa-edit"></i>' +
            '</button>' +
            '<button class="btn btn-sm ' + (c.isActive ? 'btn-secondary' : 'btn-success') + '" title="' + (c.isActive ? 'Tạm dừng mã' : 'Kích hoạt mã') + '" data-id="' + c._id + '" onclick="toggleCouponStatus(this.dataset.id)" style="padding:4px 8px; margin-right:4px;">' +
              '<i class="fas ' + (c.isActive ? 'fa-pause' : 'fa-play') + '"></i>' +
            '</button>' +
            '<button class="btn btn-sm btn-danger" title="Xóa mã" data-id="' + c._id + '" data-code="' + (c.code || '') + '" onclick="deleteCoupon(this.dataset.id, this.dataset.code)" style="padding:4px 8px;">' +
              '<i class="fas fa-trash"></i>' +
            '</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    function onCouponTypeChange(type) {
      const valLabel = document.getElementById('couponValLabel');
      const maxGroup = document.getElementById('couponMaxDiscountGroup');
      const valInput = document.getElementById('couponFormValue');
      if (type === 'percent') {
        if (valLabel) valLabel.textContent = 'Mức giảm (% *)';
        if (maxGroup) maxGroup.style.display = 'block';
        if (valInput) {
          valInput.placeholder = 'VD: 15';
          valInput.max = '100';
        }
      } else {
        if (valLabel) valLabel.textContent = 'Số tiền giảm (₫ *)';
        if (maxGroup) maxGroup.style.display = 'none';
        if (valInput) {
          valInput.placeholder = 'VD: 50000';
          valInput.removeAttribute('max');
        }
      }
    }

    function openCouponModal(couponId = null) {
      const form = document.getElementById('couponForm');
      if (!form) return;
      form.reset();

      const titleEl = document.getElementById('couponModalTitle');
      const idInput = document.getElementById('couponFormId');
      const activeCheckbox = document.getElementById('couponFormActive');
      const startDateInput = document.getElementById('couponFormStartDate');
      const endDateInput = document.getElementById('couponFormEndDate');

      if (couponId) {
        if (titleEl) titleEl.textContent = 'Chỉnh Sửa Mã Giảm Giá';
        if (idInput) idInput.value = couponId;

        const coupon = allCouponsCache.find(c => c._id === couponId);
        if (coupon) {
          document.getElementById('couponFormCode').value = coupon.code || '';
          document.getElementById('couponFormName').value = coupon.name || '';
          document.getElementById('couponFormType').value = coupon.discountType || 'percent';
          onCouponTypeChange(coupon.discountType || 'percent');
          document.getElementById('couponFormValue').value = coupon.discountValue || 0;
          document.getElementById('couponFormMaxDiscount').value = coupon.maxDiscountAmount || 0;
          document.getElementById('couponFormMinOrder').value = coupon.minOrderValue || 0;
          document.getElementById('couponFormUsageLimit').value = coupon.usageLimit || 100;
          if (coupon.startDate && startDateInput) {
            startDateInput.value = new Date(coupon.startDate).toISOString().slice(0, 10);
          }
          if (coupon.endDate && endDateInput) {
            endDateInput.value = new Date(coupon.endDate).toISOString().slice(0, 10);
          }
          if (activeCheckbox) activeCheckbox.checked = Boolean(coupon.isActive);
          document.getElementById('couponFormDesc').value = coupon.description || '';
        }
      } else {
        if (titleEl) titleEl.textContent = 'Tạo Mã Giảm Giá Mới';
        if (idInput) idInput.value = '';
        onCouponTypeChange('percent');
        const now = new Date();
        const nextMonth = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000);
        if (startDateInput) startDateInput.value = now.toISOString().slice(0, 10);
        if (endDateInput) endDateInput.value = nextMonth.toISOString().slice(0, 10);
        if (activeCheckbox) activeCheckbox.checked = true;
      }

      openModal('couponModal');
    }

    async function submitCouponForm(e) {
      if (e) e.preventDefault();

      const id = document.getElementById('couponFormId')?.value;
      const code = document.getElementById('couponFormCode')?.value?.trim().toUpperCase();
      const name = document.getElementById('couponFormName')?.value?.trim();
      const discountType = document.getElementById('couponFormType')?.value;
      const discountValue = Number(document.getElementById('couponFormValue')?.value) || 0;
      const maxDiscountAmount = Number(document.getElementById('couponFormMaxDiscount')?.value) || 0;
      const minOrderValue = Number(document.getElementById('couponFormMinOrder')?.value) || 0;
      const usageLimit = Number(document.getElementById('couponFormUsageLimit')?.value) || 100;
      const startDate = document.getElementById('couponFormStartDate')?.value;
      const endDate = document.getElementById('couponFormEndDate')?.value;
      const isActive = document.getElementById('couponFormActive')?.checked;
      const description = document.getElementById('couponFormDesc')?.value?.trim() || '';

      if (!code || !name || !endDate) {
        showCustomToast('Vui lòng điền đầy đủ các thông tin bắt buộc!', 'warning');
        return;
      }

      if (discountType === 'percent' && (discountValue <= 0 || discountValue > 100)) {
        showCustomToast('Phần trăm giảm phải từ 1% đến 100%!', 'warning');
        return;
      }

      if (discountType === 'fixed' && discountValue <= 0) {
        showCustomToast('Số tiền giảm phải lớn hơn 0₫!', 'warning');
        return;
      }

      const submitBtn = document.getElementById('btnSubmitCoupon');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu...';
      }

      try {
        const payload = {
          code,
          name,
          discountType,
          discountValue,
          maxDiscountAmount,
          minOrderValue,
          usageLimit,
          startDate,
          endDate,
          isActive,
          description
        };

        const url = id ? '/api/coupons/' + id : '/api/coupons';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: {
            ...getAuthHeaders(),
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (!res.ok || !json.success) {
          throw new Error(json.message || 'Lỗi khi lưu mã giảm giá');
        }

        showCustomToast(json.message || 'Lưu mã giảm giá thành công!', 'success');
        closeModal('couponModal');
        await loadCoupons();
      } catch (err) {
        console.error('submitCouponForm error:', err);
        showCustomToast(err.message || 'Không thể lưu mã giảm giá', 'error');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-save"></i> Lưu mã giảm giá';
        }
      }
    }

    async function toggleCouponStatus(id) {
      try {
        const res = await fetch('/api/coupons/' + id + '/toggle', {
          method: 'PATCH',
          headers: getAuthHeaders()
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Lỗi đổi trạng thái mã');

        showCustomToast(json.message || 'Đã cập nhật trạng thái mã!', 'success');
        await loadCoupons();
      } catch (err) {
        showCustomToast(err.message || 'Không thể đổi trạng thái mã', 'error');
      }
    }

    function deleteCoupon(id, code) {
      showConfirmModal(
        'Xác nhận xóa mã giảm giá',
        'Bạn có chắc chắn muốn xóa vĩnh viễn mã giảm giá "' + code + '"? Thao tác này không thể hoàn tác.',
        async () => {
          try {
            const res = await fetch('/api/coupons/' + id, {
              method: 'DELETE',
              headers: getAuthHeaders()
            });
            const json = await res.json();
            if (!res.ok || !json.success) throw new Error(json.message || 'Lỗi khi xóa mã');

            showCustomToast(json.message || 'Đã xóa mã giảm giá thành công!', 'success');
            await loadCoupons();
          } catch (err) {
            showCustomToast(err.message || 'Không thể xóa mã giảm giá', 'error');
          }
        }
      );
    }

    let auditCurrentPage = 1;
    let auditTotalPages = 1;

    async function loadAuditLogStats() {
      try {
        const res = await fetch('/api/admin/audit-logs/stats', {
          headers: getAuthHeaders()
        });
        if (!res.ok) return;
        const json = await res.json();
        if (json.success && json.data) {
          const { todayLogs, criticalCount, warningCount, totalLogs } = json.data;
          const elToday = document.getElementById('auditStatToday');
          const elCritical = document.getElementById('auditStatCritical');
          const elWarning = document.getElementById('auditStatWarning');
          const elTotal = document.getElementById('auditStatTotal');
          if (elToday) elToday.textContent = (todayLogs || 0).toLocaleString('vi-VN');
          if (elCritical) elCritical.textContent = (criticalCount || 0).toLocaleString('vi-VN');
          if (elWarning) elWarning.textContent = (warningCount || 0).toLocaleString('vi-VN');
          if (elTotal) elTotal.textContent = (totalLogs || 0).toLocaleString('vi-VN');

          // Cập nhật badge trên sidebar nếu có sự kiện critical CHƯA ĐỌC
          const unreadCount = (json.data.unreadCriticalCount !== undefined) ? json.data.unreadCriticalCount : json.data.criticalCount;
          const sidebarBadge = document.getElementById('sidebarAuditCriticalBadge');
          if (sidebarBadge) {
            if (unreadCount > 0) {
              sidebarBadge.textContent = unreadCount > 99 ? '99+' : unreadCount;
              sidebarBadge.style.display = 'inline-block';
            } else {
              sidebarBadge.style.display = 'none';
              sidebarBadge.textContent = '0';
            }
          }
        }
      } catch (err) {
        console.error('Lỗi khi tải thống kê audit log:', err);
      }
    }

    async function loadAuditLogs(page = 1) {
      auditCurrentPage = page;
      const tbody = document.getElementById('auditLogsTableBody');
      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: var(--muted);">
              <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--color-amber); margin-bottom: 8px;"></i>
              <div>Đang tải danh sách nhật ký hoạt động...</div>
            </td>
          </tr>
        `;
      }

      try {
        const search = document.getElementById('auditFilterSearch')?.value?.trim() || '';
        const moduleFilter = document.getElementById('auditFilterModule')?.value || 'ALL';
        const severity = document.getElementById('auditFilterSeverity')?.value || 'ALL';
        const startDate = document.getElementById('auditFilterStartDate')?.value || '';
        const endDate = document.getElementById('auditFilterEndDate')?.value || '';

        const params = new URLSearchParams({
          page,
          limit: 15,
          search,
          module: moduleFilter,
          severity,
          startDate,
          endDate
        });

        const res = await fetch(`/api/admin/audit-logs?${params.toString()}`, {
          headers: getAuthHeaders()
        });
        const json = await res.json();

        if (!res.ok || !json.success) {
          throw new Error(json.message || 'Không thể tải nhật ký');
        }

        const { logs, pagination } = json.data;
        auditTotalPages = pagination.totalPages || 1;

        renderAuditLogsTable(logs);
        renderAuditPagination(pagination);
        markTabLoaded('audit-logs');
      } catch (err) {
        console.error('Lỗi khi tải danh sách audit logs:', err);
        if (tbody) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" style="text-align: center; padding: 30px; color: #EF4444;">
                <i class="fas fa-exclamation-circle" style="font-size: 24px; margin-bottom: 8px;"></i>
                <div>Lỗi: ${err.message || 'Không thể tải nhật ký hoạt động'}</div>
                <button class="btn btn-secondary btn-sm" onclick="loadAuditLogs(${page})" style="margin-top: 10px;">Thử lại</button>
              </td>
            </tr>
          `;
        }
      }
    }

    function renderAuditLogsTable(logs = []) {
      const tbody = document.getElementById('auditLogsTableBody');

      if (!logs || logs.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; padding: 50px; color: var(--muted);">

      const rowsHtml = logs.map(log => {

    function renderAuditPagination(pagination) {
      const { total, totalPages, currentPage, limit } = pagination;
      const infoEl = document.getElementById('auditPaginationInfo');
      const btnsEl = document.getElementById('auditPaginationBtns');

      if (infoEl) {
        const from = Math.min((currentPage - 1) * limit + 1, total);
        const to = Math.min(currentPage * limit, total);
        infoEl.textContent = `Đang hiển thị ${total > 0 ? from : 0} - ${to} trong tổng số ${total.toLocaleString('vi-VN')} bản ghi`;
      }

      if (btnsEl) {
        let html = '';
        if (totalPages > 1) {
          html += `<button class="btn btn-secondary btn-sm" ${currentPage <= 1 ? 'disabled' : ''} onclick="loadAuditLogs(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
          
          let startPage = Math.max(1, currentPage - 2);
          let endPage = Math.min(totalPages, currentPage + 2);

          for (let p = startPage; p <= endPage; p++) {
            html += `<button class="btn btn-sm ${p === currentPage ? 'btn-primary' : 'btn-secondary'}" onclick="loadAuditLogs(${p})">${p}</button>`;
          }

          html += `<button class="btn btn-secondary btn-sm" ${currentPage >= totalPages ? 'disabled' : ''} onclick="loadAuditLogs(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
        }
        btnsEl.innerHTML = html;
      }
    }

    let auditSearchTimer = null;
    function debounceAuditLogs() {
      clearTimeout(auditSearchTimer);
      auditSearchTimer = setTimeout(() => {
        loadAuditLogs(1);
      }, 400);
    }

    function quickFilterAuditKpi(type) {
      clearTimeout(auditSearchTimer);
      const searchInput = document.getElementById('auditFilterSearch');
      const modInput = document.getElementById('auditFilterModule');
      const sevInput = document.getElementById('auditFilterSeverity');
      const sDateInput = document.getElementById('auditFilterStartDate');
      const eDateInput = document.getElementById('auditFilterEndDate');

      const now = new Date();
      const formatYmd = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      };
      const todayStr = formatYmd(now);

      const past7 = new Date();
      past7.setDate(now.getDate() - 7);
      const past7Str = formatYmd(past7);

      if (searchInput) searchInput.value = '';
      if (modInput) modInput.value = 'ALL';

      // Update active highlight on KPI cards
      document.querySelectorAll('.audit-kpi-card').forEach(card => {
        card.classList.remove('audit-kpi-active');
      });
      const targetCard = document.getElementById(`auditCard_${type}`);
      if (targetCard) {
        targetCard.classList.add('audit-kpi-active');
      }

      if (type === 'today') {
        if (sDateInput) sDateInput.value = todayStr;
        if (eDateInput) eDateInput.value = todayStr;
        if (sevInput) sevInput.value = 'ALL';
      } else if (type === 'critical') {
        if (sDateInput) sDateInput.value = past7Str;
        if (eDateInput) eDateInput.value = todayStr;
        if (sevInput) sevInput.value = 'CRITICAL';
      } else if (type === 'warning') {
        if (sDateInput) sDateInput.value = past7Str;
        if (eDateInput) eDateInput.value = todayStr;
        if (sevInput) sevInput.value = 'WARNING';
      } else if (type === 'total') {
        if (sDateInput) sDateInput.value = '';
        if (eDateInput) eDateInput.value = '';
        if (sevInput) sevInput.value = 'ALL';
      }

      if (window.UniversalDropdown) {
        if (modInput) UniversalDropdown.sync(modInput);
        if (sevInput) UniversalDropdown.sync(sevInput);
      }

      loadAuditLogs(1);
    }

    function filterAuditLogs() {
      clearTimeout(auditSearchTimer);

      document.querySelectorAll('.audit-kpi-card').forEach(card => {

    async function viewAuditLogDetail(logId) {
      try {
        const res = await fetch(`/api/admin/audit-logs/${logId}`, {
          headers: getAuthHeaders()
        });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Không tìm thấy chi tiết nhật ký');

        const log = json.data;

        // Điền modal
        document.getElementById('auditDetailLogId').textContent = `ID: ${log._id}`;
        document.getElementById('auditDetailPerformerName').textContent = log.performerName || 'Hệ thống';
        document.getElementById('auditDetailPerformerEmail').textContent = log.performerEmail ? `${log.performerEmail} (${log.performerRole || ''})` : (log.performerRole || '');

        const initial = (log.performerName || 'SYS').split(' ').map(w => w[0]).join('').slice(-2).toUpperCase();
        document.getElementById('auditDetailAvatar').textContent = initial;

        const dateObj = new Date(log.createdAt);
        document.getElementById('auditDetailTime').textContent = dateObj.toLocaleString('vi-VN');
        document.getElementById('auditDetailIp').textContent = log.ipAddress || '127.0.0.1';

        document.getElementById('auditDetailModuleBadge').textContent = log.module || 'SYSTEM';
        document.getElementById('auditDetailActionTag').textContent = log.action || '';

        // Severity
        const sevEl = document.getElementById('auditDetailSeverityBadge');
        if (log.severity === 'CRITICAL') {
          sevEl.innerHTML = `<span class="badge" style="background:#FEE2E2; color:#B91C1C; font-weight:700;"><span class="badge-dot" style="background:#DC2626;"></span> Nghiêm trọng (CRITICAL)</span>`;
        } else if (log.severity === 'WARNING') {
          sevEl.innerHTML = `<span class="badge" style="background:#FEF3C7; color:#B45309;"><span class="badge-dot" style="background:#D97706;"></span> Cảnh báo (WARNING)</span>`;
        } else {
          sevEl.innerHTML = `<span class="badge" style="background:#E0F2FE; color:#0369A1;"><span class="badge-dot" style="background:#0284C7;"></span> Thông tin (INFO)</span>`;
        }

        document.getElementById('auditDetailDescription').textContent = log.description || 'Không có mô tả chi tiết';
        document.getElementById('auditDetailUserAgent').textContent = log.userAgent || 'Trình duyệt không xác định';

        // Diff Section
        const diffSection = document.getElementById('auditDetailDiffSection');
        const diffBody = document.getElementById('auditDetailDiffBody');
        if (log.diff && log.diff.length > 0) {
          diffSection.style.display = 'block';
          diffBody.innerHTML = log.diff.map(d => {
            const formatVal = (v) => {
              if (v === null || v === undefined) return '<span style="color:var(--muted); font-style:italic;">(Trống)</span>';
              if (typeof v === 'object') return `<pre style="margin:0; font-size:11px;">${JSON.stringify(v, null, 2)}</pre>`;
              return escapeHtml(String(v));
            };
            return `
              <tr style="border-bottom: 1px solid #E2E8F0;">
                <td style="padding: 10px 14px; font-weight: 600; color: var(--navy-800);">${escapeHtml(d.fieldLabel || d.field)}</td>
                <td style="padding: 10px 14px; background: #FEF2F2; color: #991B1B;">${formatVal(d.oldValue)}</td>
                <td style="padding: 10px 14px; background: #ECFDF5; color: #065F46; font-weight: 600;">${formatVal(d.newValue)}</td>
              </tr>
            `;
          }).join('');
        } else {
          diffSection.style.display = 'none';
        }

        // Cập nhật số badge trên sidebar ngay khi xem chi tiết
        if (json.unreadCriticalCount !== undefined) {
          const sidebarBadge = document.getElementById('sidebarAuditCriticalBadge');
          if (sidebarBadge) {
            if (json.unreadCriticalCount > 0) {
              sidebarBadge.textContent = json.unreadCriticalCount > 99 ? '99+' : json.unreadCriticalCount;
              sidebarBadge.style.display = 'inline-block';
            } else {
              sidebarBadge.style.display = 'none';
              sidebarBadge.textContent = '0';
            }
          }
        }

        openModal('modalAuditLogDetail');
      } catch (err) {
        showCustomToast(err.message || 'Không thể mở chi tiết nhật ký', 'error');
      }
    }
